name: Firmware

on:
  push:
    branches: ["**"]
    tags: ["firmware/v*"]

env:
  NAOS_VERSION: v0.16.0

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - name: Install BMV080 SDK
        uses: actions/checkout@v4
        with:
          repository: networkedartifacts/airlab-bmv080
          ssh-key: ${{ secrets.BMV080_DEPLOY_KEY }}
          path: firmware/sdk/bmv080
      - name: Install naos
        run: |
          curl -L -o /usr/local/bin/naos https://github.com/256dpi/naos/releases/download/${{ env.NAOS_VERSION }}/naos-linux-amd64
          chmod +x /usr/local/bin/naos
      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: ~/.naos
          key: naos-${{ env.NAOS_VERSION }}-${{ hashFiles('firmware/naos.json') }}
      - name: Install SDK
        run: naos install
      - name: Verify BMV080 SDK
        if: startsWith(github.ref, 'refs/tags/firmware/v')
        run: test -f sdk/bmv080/bmv080.h  # releases must not ship the stub
      - name: Build
        run: naos build
      - name: Test
        run: make test
      - name: Bundle
        run: naos bundle na-airlab.zip --add-debug
      - name: Release
        if: startsWith(github.ref, 'refs/tags/firmware/v')
        uses: softprops/action-gh-release@v1
        with:
          files: firmware/na-airlab.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to CDN
        if: startsWith(github.ref, 'refs/tags/firmware/v')
        run: |
          curl --fail --retry 3 -X PUT \
            -H "Authorization: Bearer ${{ secrets.CDN_TOKEN }}" \
            --data-binary @na-airlab.zip \
            https://cdn.networkedartifacts.com/al1-fw__${GITHUB_REF_NAME#firmware/}.zip
